name: Build BFCrewSync.exe

# Builds a self-contained, single-file win-x64 executable on a hosted
# Windows runner — no local .NET SDK, NuGet access, or Windows machine
# needed on your end. Grab the result from the "Actions" tab (or from
# the Release if you pushed a version tag).
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch: {}   # lets you click "Run workflow" manually on GitHub

permissions:
  contents: write   # needed only for the release-upload step on tag pushes

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore BFCrewSync.csproj

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish BFCrewSync.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish_output

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BFCrewSync-win-x64
          path: publish_output/BFCrewSync.exe
          if-no-files-found: error

      # Only runs when you push a tag like "v1.0" — attaches the exe
      # directly to a GitHub Release so there's a permanent download link.
      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish_output/BFCrewSync.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
